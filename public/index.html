<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Digian</title>
  <script>
    // Set the theme before first paint so there is no flash of the wrong colors.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("digian-theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#view" id="skipLink">Skip to main content</a>

  <div class="app" id="app">
    <!-- Sidebar (navigation is rendered per role by js/app.js) -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M7 3h10"/></svg>
        </div>
        <span class="brand-name">Digian</span>
        <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <nav class="nav" id="nav" aria-label="Pages"></nav>
    </aside>

    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="sidebarToggle" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <nav class="crumbs" aria-label="Breadcrumb">
            <span>Enterprise T&amp;E</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            <span class="current" id="crumbCurrent" aria-current="page">Overview</span>
          </nav>
        </div>
        <div class="top-right">
          <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Switch to dark theme" title="Switch theme">
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>

          <!-- Role switcher -->
          <div class="user-menu">
            <button class="user" id="userBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="roleMenu">
              <div class="user-text">
                <div class="user-name" id="userName"></div>
                <div class="user-role" id="userRole"></div>
              </div>
              <div class="avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
              </div>
              <span class="sr-only">Switch role</span>
              <svg class="user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="menu" id="roleMenu" role="menu" aria-label="View as" hidden>
              <div class="menu-label" aria-hidden="true">View as</div>
              <div id="roleMenuList"></div>
            </div>
          </div>
        </div>
      </header>

      <section class="content" id="view" aria-live="off"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <!-- Motion 14.14.0 (MIT), the vanilla build of Framer Motion. Pinned local copy, see js/vendor/LICENSE-motion.txt -->
  <script src="js/vendor/motion.js"></script>
  <script src="js/views.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
